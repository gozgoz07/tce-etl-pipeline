name: Daily Pipeline (arXiv, Attach, Snapshot)

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Collect arXiv
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run tce collect --source arxiv

      - name: Attach items to topics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run tce attach --since-days 7

      - name: Compute topic snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run tce snapshot
