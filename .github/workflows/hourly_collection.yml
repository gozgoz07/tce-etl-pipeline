name: Hourly Collection (HN, RSS & HF)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Collect Hacker News
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run tce collect --source hn

      - name: Collect RSS feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run tce collect --source rss

      - name: Collect Hugging Face Models
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run tce collect --source hf
